# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then New → Blueprint on Render

services:
  - type: web
    name: phoenix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
